<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TaskFlow — Dashboard</title>
<style>
  body{font-family:sans-serif;margin:0;color:#111;background:#f8fafc}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;background:#fff;border-bottom:1px solid #e2e8f0}
  .logo-slot{display:flex;align-items:center;gap:8px;font-weight:bold}   <!-- T3: Mockup/Data/Logo.svg -->
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:32px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px}
  .card h2{margin:0;font-size:14px;color:#64748b}
  .card .num{font-size:40px;margin-top:8px}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo-slot">[LOGO] TaskFlow</div>
  <button>Log out</button>
</div>
<div class="stats">
  <div class="card"><h2>Open</h2><div class="num">12</div></div>
  <div class="card"><h2>Done</h2><div class="num">34</div></div>
  <div class="card"><h2>Overdue</h2><div class="num">3</div></div>
</div>
</body>
</html>
