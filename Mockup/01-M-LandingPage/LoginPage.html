<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TaskFlow — Login</title>
<style>
  body{font-family:sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f8fafc;color:#111}
  .box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:40px;width:340px}
  .logo-slot{display:flex;justify-content:center;margin-bottom:24px;font-weight:bold}  <!-- T3: Mockup/Data/Logo.svg -->
  label{display:block;margin:16px 0 4px;font-size:14px}
  input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
  .btn{width:100%;margin-top:24px;background:#2563eb;color:#fff;padding:12px;border:none;border-radius:8px}
  .alt{margin-top:16px;font-size:13px;text-align:center;color:#64748b}
</style>
</head>
<body>
<div class="box">
  <div class="logo-slot">[LOGO] TaskFlow</div>
  <form>
    <label>Email</label><input type="email" placeholder="you@work.com">
    <label>Password</label><input type="password" placeholder="••••••••">
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="alt">No account? Sign up</p>
</div>
</body>
</html>
